<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finances">
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Mes finances</title>
<style>
:root{--bg:#f4f6fb;--card:#ffffff;--card2:#eef2fa;--txt:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#2563eb;--acc2:#93c5fd;--pos:#059669;--neg:#dc2626;--warn:#d97706;--c1:#2563eb;--c2:#93c5fd;--c3:#f97316;--c4:#fdba74;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);
--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--card2:#1a2540;--txt:#e5ecf6;--mut:#8a9bb5;--line:#22304a;--acc:#60a5fa;--acc2:#1e40af;--pos:#34d399;--neg:#f87171;--warn:#fbbf24;--c1:#60a5fa;--c2:#1e3a8a;--c3:#fb923c;--c4:#7c2d12;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
/* lock */
#lock{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + var(--sat)) 24px calc(24px + var(--sab))}
#lock img{width:84px;height:84px;border-radius:20px;box-shadow:0 8px 30px rgba(37,99,235,.35)}
#lock h1{margin:18px 0 4px;font-size:26px}
#lock p{margin:0 0 22px;color:var(--mut);text-align:center}
#lock form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
#lock input[type=password]{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:17px;outline:none}
#lock input[type=password]:focus{border-color:var(--acc)}
#lock label{display:flex;gap:10px;align-items:center;color:var(--mut);font-size:14px}
#lock input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
.btn{padding:14px;border-radius:14px;border:0;background:var(--acc);color:#fff;font-weight:600;font-size:16px}
.btn:disabled{opacity:.6}
#lockErr{color:var(--neg);min-height:20px;text-align:center;font-size:14px}
/* app */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);padding:calc(10px + var(--sat)) calc(16px + var(--sar)) 10px calc(16px + var(--sal));display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;flex:1}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--card2);color:var(--acc);white-space:nowrap}
.icon-btn{border:0;background:transparent;padding:6px;border-radius:10px;color:var(--mut)}
main{padding:14px calc(14px + var(--sar)) calc(96px + var(--sab)) calc(14px + var(--sal));max-width:760px;margin:0 auto}
.view>h2{font-size:22px;margin:4px 2px 12px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h3{margin:0 0 4px;font-size:16px}
.card .sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.hero{background:linear-gradient(135deg,#2563eb,#1e3a8a);color:#fff;border:0}
.hero .lbl{opacity:.85;font-size:14px}
.hero .big{font-size:38px;font-weight:700;letter-spacing:-.5px;margin:2px 0}
.hero .meta{opacity:.85;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.metric .v{font-size:20px;font-weight:700;letter-spacing:-.3px}
.metric .l{font-size:13px;color:var(--mut)}
.metric .d{font-size:12px;color:var(--mut);margin-top:2px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}.mut{color:var(--mut)}
.callout{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card))}
.callout.info{border-left-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--mut)}
.row .amt{font-weight:600;text-align:right;white-space:nowrap}
.row .amt small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--card2);color:var(--mut);margin:2px 4px 0 0}
.badge.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.r{background:color-mix(in srgb,var(--neg) 15%,transparent);color:var(--neg)}
.badge.g{background:color-mix(in srgb,var(--pos) 15%,transparent);color:var(--pos)}
.badge.b{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:var(--shadow)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--mut);font-size:10px}
.hbar{margin:9px 0}
.hbar .top{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.hbar .top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:8px;background:var(--card2);border-radius:99px;margin-top:5px;overflow:hidden}
.hbar .fill{height:100%;background:var(--acc);border-radius:99px}
.hbar .m{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{color:var(--mut);font-weight:600;font-size:12px}
tr.tot td{font-weight:700;border-bottom:0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}.kv b{white-space:nowrap}
.daysep{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin:14px 2px 2px}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:10px;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.op-int{opacity:.55}
.foot{color:var(--mut);font-size:12px;text-align:center;margin:18px 8px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);padding:6px calc(4px + var(--sar)) calc(6px + var(--sab)) calc(4px + var(--sal))}
nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--mut);padding:4px 0}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
details summary{cursor:pointer;color:var(--acc);font-size:13.5px;font-weight:600;list-style:none;margin-top:6px}
details summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<section id="lock">
  <img src="icon-180.png" alt="">
  <h1>Mes finances</h1>
  <p>Données chiffrées. Entre ton code pour les afficher.</p>
  <form id="lockForm" autocomplete="off">
    <input id="code" type="password" placeholder="Code" autocomplete="current-password" aria-label="Code">
    <label><input id="remember" type="checkbox"> Se souvenir sur cet appareil</label>
    <button class="btn" id="unlockBtn" type="submit">Déverrouiller</button>
    <div id="lockErr" role="alert"></div>
  </form>
</section>

<div id="app" class="hidden">
  <header>
    <h1 id="hTitle">Accueil</h1>
    <span class="pill" id="dataDate">Données au —</span>
    <button class="icon-btn" id="lockBtn" aria-label="Verrouiller" title="Verrouiller"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
  </header>
  <main>
    <section class="view" id="v-accueil"></section>
    <section class="view hidden" id="v-budget"></section>
    <section class="view hidden" id="v-prlv"></section>
    <section class="view hidden" id="v-epargne"></section>
    <section class="view hidden" id="v-ops"></section>
  </main>
  <nav id="tabs">
    <button data-v="accueil" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
    <button data-v="budget"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Budget</button>
    <button data-v="prlv"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Prélèvements</button>
    <button data-v="epargne"><svg viewBox="0 0 24 24"><path d="M19 9c0-3-3-5-7-5S5 6 5 9c0 2 1 3 2 4v4h3v-2h4v2h3v-4c1-1 2-2 2-4z"/><circle cx="15" cy="9" r=".6"/></svg>Épargne</button>
    <button data-v="ops"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Opérations</button>
  </nav>
</div>

<script>
'use strict';
const LS_KEY = 'mf-code';
let D = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf2 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
const eur = (n, z) => (n == null ? '—' : (n < 0 ? '−' : '') + (z ? nf0 : nf2).format(Math.abs(n)) + '\u00a0€');
const eurS = (n, z) => (n == null ? '—' : (n < 0 ? '−' : n > 0 ? '+' : '') + (z ? nf0 : nf2).format(Math.abs(n)) + '\u00a0€');
const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const JOURS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const pd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fdate = (s) => { const d = pd(s); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear(); };
const fshort = (s) => { const d = pd(s); return d.getDate() + ' ' + MOIS[d.getMonth()]; };
const flong = (s) => { const d = pd(s); return JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()]; };
const cls = (n) => (n < 0 ? 'neg' : n > 0 ? 'pos' : '');

/* ---------------- crypto ---------------- */
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decryptData(blob, code) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(blob.salt), iterations: blob.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(blob.iv) }, key, b64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function loadBlob() {
  const r = await fetch('data.enc?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('net');
  return r.json();
}
async function unlock(code, remember, silent) {
  const btn = $('#unlockBtn'), err = $('#lockErr');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; err.textContent = '';
  try {
    let blob;
    try { blob = await loadBlob(); } catch (e) { err.textContent = 'Impossible de charger les données (hors ligne ?).'; return false; }
    try { D = await decryptData(blob, code); } catch (e) {
      if (!silent) err.textContent = 'Code incorrect.';
      localStorage.removeItem(LS_KEY);
      return false;
    }
    if (remember) localStorage.setItem(LS_KEY, code); else if (!silent) localStorage.removeItem(LS_KEY);
    $('#code').value = '';
    render();
    $('#lock').classList.add('hidden'); $('#app').classList.remove('hidden');
    return true;
  } finally { btn.disabled = false; btn.textContent = 'Déverrouiller'; }
}
$('#lockForm').addEventListener('submit', (e) => { e.preventDefault(); const c = $('#code').value; if (c) unlock(c, $('#remember').checked, false); });
$('#lockBtn').addEventListener('click', () => {
  if (localStorage.getItem(LS_KEY) && !confirm('Verrouiller et oublier le code sur cet appareil ?')) return;
  localStorage.removeItem(LS_KEY); D = null;
  document.querySelectorAll('.view').forEach((v) => (v.innerHTML = ''));
  $('#app').classList.add('hidden'); $('#lock').classList.remove('hidden'); $('#remember').checked = false;
});

/* ---------------- tabs ---------------- */
const TITLES = { accueil: 'Accueil', budget: 'Budget', prlv: 'Prélèvements', epargne: 'Épargne', ops: 'Opérations' };
function show(v) {
  document.querySelectorAll('.view').forEach((s) => s.classList.toggle('hidden', s.id !== 'v-' + v));
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  $('#hTitle').textContent = TITLES[v]; window.scrollTo(0, 0);
  try { sessionStorage.setItem('mf-tab', v); } catch (e) {}
}
document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => show(b.dataset.v)));

/* ---------------- charts ---------------- */
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function barChart(labels, series, opts = {}) {
  const W = 340, H = 190, L = 38, B = 34, T = 10, R = 4;
  const max = niceMax(Math.max(1, ...series.flatMap((s) => s.values)));
  const gw = (W - L - R) / labels.length, bw = Math.min(26, (gw - 10) / series.length);
  let g = '';
  for (let i = 0; i <= 4; i++) { const y = T + (H - T - B) * (1 - i / 4); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L - 5}" y="${y + 3}" text-anchor="end">${nf0.format(max * i / 4)}</text>`; }
  labels.forEach((lab, i) => {
    const x0 = L + gw * i + (gw - bw * series.length) / 2;
    series.forEach((s, j) => { const v = s.values[i] || 0; const h = (H - T - B) * Math.max(0, v) / max; g += `<rect x="${x0 + j * bw + 1}" y="${H - B - h}" width="${bw - 2}" height="${h}" rx="3" fill="${s.color}"><title>${esc(s.name)} : ${eur(v)}</title></rect>`; });
    const parts = String(lab).split('|');
    parts.forEach((p, k) => (g += `<text x="${L + gw * i + gw / 2}" y="${H - B + 13 + k * 11}" text-anchor="middle">${esc(p)}</text>`));
  });
  const lg = series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="legend">${lg}</div>`;
}
function lineChart(points, opts = {}) {
  // points: [[iso, value]]; multiple series via opts.series
  const series = opts.series || [{ pts: points, color: 'var(--acc)', name: opts.name || '' }];
  const W = 340, H = opts.h || 170, L = 40, B = 22, T = 10, R = 6;
  const all = series.flatMap((s) => s.pts);
  const xs = all.map((p) => pd(p[0]).getTime()), ys = all.map((p) => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(0, ...ys), y1 = niceMax(Math.max(...ys));
  if (y0 < 0) y0 = -niceMax(-y0);
  const X = (t) => L + (W - L - R) * (x1 === x0 ? 0.5 : (t - x0) / (x1 - x0));
  const Y = (v) => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = y0 + (y1 - y0) * i / 4, y = Y(v); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L - 5}" y="${y + 3}" text-anchor="end">${nf0.format(v)}</text>`; }
  if (y0 < 0) g += `<line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mut)" stroke-dasharray="3 3"/>`;
  // month ticks
  const d0 = new Date(x0); let m = new Date(d0.getFullYear(), d0.getMonth() + 1, 1);
  while (m.getTime() <= x1) { const x = X(m.getTime()); g += `<line x1="${x}" x2="${x}" y1="${T}" y2="${H - B}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${x}" y="${H - 6}" text-anchor="middle">${MOIS[m.getMonth()]}</text>`; m = new Date(m.getFullYear(), m.getMonth() + 1, 1); }
  series.forEach((s, si) => {
    const pts = s.pts.map((p) => [X(pd(p[0]).getTime()), Y(p[1])]);
    const path = opts.step ? pts.map((p, i) => (i ? `H${p[0].toFixed(1)}V${p[1].toFixed(1)}` : `M${p[0].toFixed(1)},${p[1].toFixed(1)}`)).join('') : pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
    if (opts.area && si === 0) g += `<path d="${path}V${Y(Math.max(0, y0))}H${pts[0][0]}Z" fill="${s.color}" opacity=".12"/>`;
    g += `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const lp = pts[pts.length - 1]; g += `<circle cx="${lp[0]}" cy="${lp[1]}" r="3.5" fill="${s.color}"/>`;
    if (opts.dots) pts.forEach((p) => (g += `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${s.color}"/>`));
  });
  const lg = series.length > 1 ? `<div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>${lg}`;
}
const PAL = ['#2563eb', '#f97316', '#10b981', '#a855f7', '#eab308', '#ef4444', '#06b6d4', '#ec4899', '#84cc16', '#6366f1', '#14b8a6', '#f59e0b', '#64748b'];
function donut(items, center) {
  const tot = items.reduce((a, b) => a + Math.max(0, b.v), 0) || 1; const R = 60, r = 40, C = 75; let a = -Math.PI / 2, g = '';
  items.forEach((it, i) => {
    const f = Math.max(0, it.v) / tot; if (f <= 0) return; const a2 = a + f * Math.PI * 2 - 0.0001; const large = f > 0.5 ? 1 : 0;
    const p = (ang, rad) => [C + rad * Math.cos(ang), C + rad * Math.sin(ang)];
    const [x1, y1] = p(a, R), [x2, y2] = p(a2, R), [x3, y3] = p(a2, r), [x4, y4] = p(a, r);
    g += `<path d="M${x1},${y1}A${R},${R} 0 ${large} 1 ${x2},${y2}L${x3},${y3}A${r},${r} 0 ${large} 0 ${x4},${y4}Z" fill="${PAL[i % PAL.length]}"><title>${esc(it.l)} : ${eur(it.v)}</title></path>`; a = a2 + 0.0001;
  });
  g += `<text x="${C}" y="${C - 2}" text-anchor="middle" style="font-size:15px;font-weight:700;fill:var(--txt)">${esc(center[0])}</text><text x="${C}" y="${C + 14}" text-anchor="middle">${esc(center[1])}</text>`;
  return `<svg viewBox="0 0 150 150" style="max-width:190px;margin:0 auto 8px">${g}</svg>`;
}

}

  });
  const cur = root.querySelector('.search');
  root.innerHTML = `<h2>Dernières opérations</h2>
    <input class="search" type="search" placeholder="Rechercher un libellé ou une catégorie" value="${esc(q)}">
    <div class="chips">${[['all', 'Tout'], ['dep', 'Dépenses'], ['rev', 'Rentrées'], ['pon', 'Ponctuels'], ['int', 'Internes']].map(([v, l]) => `<button data-f="${v}" class="${v === filter ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="card" style="padding-top:4px">${html || '<p class="sub">Aucune opération.</p>'}</div>
    <div class="foot">${list.length} opération${list.length > 1 ? 's' : ''} · compte de dépôt · ${D.nb_internes} virements internes exclus des calculs (affichés en grisé)</div>`;
  const s = root.querySelector('.search');
  s.addEventListener('input', () => { const pos = s.selectionStart; renderOps(filter, s.value); const n = $('#v-ops .search'); n.focus(); n.setSelectionRange(pos, pos); });
  root.querySelectorAll('.chips button').forEach((b) => b.addEventListener('click', () => renderOps(b.dataset.f, s.value)));
}

/* ---------------- boot ---------------- */
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
(async () => {
  const saved = localStorage.getItem(LS_KEY);
  if (saved) { $('#remember').checked = true; await unlock(saved, true, true); }
})();
</script>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finances">
<meta name="theme-color" content="#09090b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Mes finances</title>
<style>
:root{
  --bg:#06070b;--bg2:#0b0e16;--glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.07);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --txt:#f4f6fb;--mut:#8d95a8;--dim:#5d6579;
  --acc:#6b8cff;--acc2:#9b6bff;--pos:#2ee6a6;--neg:#ff5d78;--warn:#ffb648;--orange:#ff9152;
  --r:22px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--txt);background:var(--bg);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 520px at 85% -10%,rgba(107,140,255,.20),transparent 60%),radial-gradient(700px 480px at -10% 8%,rgba(155,107,255,.14),transparent 60%),radial-gradient(800px 600px at 50% 110%,rgba(46,230,166,.06),transparent 60%),var(--bg)}
button,input{font:inherit;color:inherit}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.02em}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}.mut{color:var(--mut)}.acc{color:var(--acc)}
.g-pos{color:var(--pos);text-shadow:0 0 22px rgba(46,230,166,.45)}
.g-neg{color:var(--neg);text-shadow:0 0 22px rgba(255,93,120,.45)}
.g-acc{color:#fff;text-shadow:0 0 26px rgba(107,140,255,.55)}

/* ---------- lock ---------- */
#lock{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + var(--sat)) 28px calc(24px + var(--sab))}
#lock .logo{width:92px;height:92px;border-radius:24px;box-shadow:0 0 0 1px var(--line2),0 18px 60px rgba(107,140,255,.35);animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
#lock h1{margin:22px 0 6px;font-size:30px;font-weight:700;letter-spacing:-.03em}
#lock p{margin:0 0 28px;color:var(--mut);text-align:center;font-size:14.5px}
#lock form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
.field{width:100%;padding:16px 18px;border-radius:16px;border:1px solid var(--line2);background:var(--glass);font-size:17px;outline:none;transition:border-color .2s,box-shadow .2s;letter-spacing:.08em}
.field:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(107,140,255,.18)}
#lock label{display:flex;gap:10px;align-items:center;color:var(--mut);font-size:14px}
#lock input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
.btn{padding:16px;border-radius:16px;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:650;font-size:16px;box-shadow:0 10px 30px rgba(107,140,255,.35);transition:transform .15s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.7}
#lockErr{color:var(--neg);min-height:20px;text-align:center;font-size:14px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lockfoot{margin-top:28px;color:var(--dim);font-size:12px;display:flex;gap:6px;align-items:center}
.lockfoot svg,.icon-btn svg{width:auto;flex:none;display:inline-block}

/* ---------- layout ---------- */
header{position:sticky;top:0;z-index:5;padding:calc(10px + var(--sat)) calc(18px + var(--sar)) 12px calc(18px + var(--sal));display:flex;align-items:center;gap:10px;
  background:linear-gradient(to bottom,rgba(6,7,11,.92),rgba(6,7,11,.70));backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-bottom:1px solid var(--line)}
header h1{font-size:22px;margin:0;flex:1;font-weight:700;letter-spacing:-.03em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:6px 11px;border-radius:999px;background:rgba(107,140,255,.14);color:#b8c7ff;border:1px solid rgba(107,140,255,.28);white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--pos);box-shadow:0 0 8px var(--pos)}
.icon-btn{border:1px solid var(--line);background:var(--glass);width:36px;height:36px;border-radius:12px;color:var(--mut);display:grid;place-items:center}
main{padding:16px calc(16px + var(--sar)) calc(110px + var(--sab)) calc(16px + var(--sal));max-width:720px;margin:0 auto}
.view>h2{font-size:28px;margin:6px 4px 16px;font-weight:750;letter-spacing:-.035em}
.sec{font-size:13px;font-weight:650;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:24px 6px 10px}

/* ---------- cards ---------- */
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 20px 40px -24px rgba(0,0,0,.8)}
.card h3{margin:0 0 3px;font-size:16.5px;font-weight:650;letter-spacing:-.015em}
.card .sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.hero{padding:22px 20px 14px;overflow:hidden;border:1px solid rgba(107,140,255,.28);
  background:radial-gradient(120% 140% at 100% 0%,rgba(155,107,255,.30),transparent 55%),radial-gradient(120% 120% at 0% 100%,rgba(107,140,255,.25),transparent 55%),linear-gradient(160deg,#121a33,#0b0f1d)}
.hero .lbl{color:#c5cde6;font-size:14px;font-weight:550;display:flex;justify-content:space-between;align-items:center}
.hero .big{font-size:48px;font-weight:750;letter-spacing:-.045em;margin:6px 0 2px;line-height:1.05}
.hero .big .cents{font-size:28px;opacity:.75}
.hero .meta{color:#aab3cc;font-size:13px}
.hero .chips2{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:7px 11px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);color:#d5dbec}
.chip b{font-weight:650}
.hero svg{margin:12px -6px -4px;width:calc(100% + 12px)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.metric{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:20px;padding:14px 15px}
.metric .l{font-size:12.5px;color:var(--mut);font-weight:550}
.metric .v{font-size:23px;font-weight:720;margin-top:4px;letter-spacing:-.03em}
.metric .d{font-size:12px;color:var(--dim);margin-top:3px}
.metric .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;margin-bottom:8px;font-size:14px}
.alert{display:flex;gap:12px;align-items:flex-start;border-radius:18px;padding:14px 15px;margin-bottom:10px;border:1px solid}
.alert .ai{width:30px;height:30px;flex:none;border-radius:10px;display:grid;place-items:center;font-weight:800}
.alert .at{font-weight:650;font-size:14.5px}
.alert .ax{font-size:13px;color:var(--mut);margin-top:2px}
.alert.rouge{background:linear-gradient(135deg,rgba(255,93,120,.16),rgba(255,93,120,.05));border-color:rgba(255,93,120,.35)}
.alert.rouge .ai{background:rgba(255,93,120,.2);color:var(--neg);box-shadow:0 0 16px rgba(255,93,120,.35)}
.alert.orange{background:linear-gradient(135deg,rgba(255,182,72,.14),rgba(255,182,72,.04));border-color:rgba(255,182,72,.32)}
.alert.orange .ai{background:rgba(255,182,72,.2);color:var(--warn)}
.alert.bleu{background:linear-gradient(135deg,rgba(107,140,255,.14),rgba(107,140,255,.04));border-color:rgba(107,140,255,.3)}
.alert.bleu .ai{background:rgba(107,140,255,.2);color:var(--acc)}
.bignum{font-size:38px;font-weight:750;letter-spacing:-.04em;line-height:1.1;margin:4px 0 6px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .av{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.row .main{flex:1;min-width:0}
.row .t{font-weight:560;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--mut);margin-top:1px}
.row .amt{font-weight:650;text-align:right;white-space:nowrap;font-size:15px}
.row .amt small{display:block;font-weight:500;font-size:11.5px;color:var(--dim);margin-top:1px}
.badge{display:inline-block;font-size:10.5px;font-weight:650;padding:2px 7px;border-radius:999px;background:var(--glass2);color:var(--mut);margin:3px 4px 0 0;letter-spacing:.01em}
.badge.w{background:rgba(255,182,72,.14);color:var(--warn)}
.badge.r{background:rgba(255,93,120,.14);color:var(--neg)}
.badge.g{background:rgba(46,230,166,.13);color:var(--pos)}
.badge.b{background:rgba(107,140,255,.15);color:#a9b9ff}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}.kv b{white-space:nowrap;font-weight:650}
.kv.total{border-top:1px solid var(--line2);border-bottom:0;margin-top:2px;padding-top:12px}
.seg{position:relative;display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:11px;font-size:13.5px;font-weight:620;color:var(--mut);transition:all .25s var(--ease);white-space:nowrap}
.seg button.on{background:rgba(255,255,255,.1);color:var(--txt);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--dim);font-size:9.5px;font-family:inherit;font-variant-numeric:tabular-nums}
.hbar{margin:12px 0}
.hbar .top{display:flex;justify-content:space-between;font-size:14px;gap:10px;align-items:baseline}
.hbar .top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#dfe4f1}
.hbar .track{height:7px;background:rgba(255,255,255,.06);border-radius:99px;margin-top:7px;overflow:hidden}
.hbar .fill{height:100%;border-radius:99px;transform-origin:left}
.hbar .m{font-size:11.5px;color:var(--dim);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.daysep{font-size:11.5px;font-weight:650;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin:16px 2px 2px}
.daysep:first-child{margin-top:4px}
.search{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--glass);margin-bottom:12px;outline:none}
.search:focus{border-color:var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--mut);transition:all .2s}
.chips button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(107,140,255,.35)}
.op-int{opacity:.45}
.foot{color:var(--dim);font-size:11.5px;text-align:center;margin:22px 10px;line-height:1.6}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;margin:14px 0 6px}
.stack div{height:100%;transform-origin:left}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.more{color:var(--acc);font-size:13.5px;font-weight:620;margin-top:8px;display:inline-block}

/* ---------- tab bar ---------- */
nav{position:fixed;left:calc(12px + var(--sal));right:calc(12px + var(--sar));bottom:calc(10px + var(--sab));z-index:10;display:flex;padding:6px;border-radius:26px;
  background:rgba(18,21,32,.72);backdrop-filter:saturate(1.8) blur(24px);-webkit-backdrop-filter:saturate(1.8) blur(24px);border:1px solid var(--line2);box-shadow:0 20px 50px rgba(0,0,0,.6)}
nav button{position:relative;flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:620;color:var(--dim);padding:7px 0 6px;border-radius:20px;transition:color .25s}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#fff;background:linear-gradient(180deg,rgba(107,140,255,.28),rgba(107,140,255,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
nav button.on svg{filter:drop-shadow(0 0 6px rgba(107,140,255,.8))}

/* ---------- motion ---------- */
.view.anim>*{animation:rise .55s var(--ease) both}
.view.anim>*:nth-child(2){animation-delay:.04s}.view.anim>*:nth-child(3){animation-delay:.08s}.view.anim>*:nth-child(4){animation-delay:.12s}
.view.anim>*:nth-child(5){animation-delay:.16s}.view.anim>*:nth-child(6){animation-delay:.2s}.view.anim>*:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.view.anim .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s .15s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.view.anim .ringc{animation:ringin 1.3s .15s var(--ease) both}@keyframes ringin{from{stroke-dasharray:0 1}}
.warn{color:var(--warn)}details>summary{list-style:none;cursor:pointer}details>summary::-webkit-details-marker{display:none}
.view.anim .areaf{animation:fade 1.2s .5s both}
@keyframes fade{from{opacity:0}}
.view.anim .grow{transform-box:fill-box;transform-origin:bottom;animation:growy .9s var(--ease) both}
@keyframes growy{from{transform:scaleY(0)}}
.view.anim .fill,.view.anim .stack div{animation:growx 1s .1s var(--ease) both}
@keyframes growx{from{transform:scaleX(0)}}
.view.anim .arc{animation:fade .9s both}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}.view .draw{stroke-dashoffset:0}}
</style>
<style id="theme">
.ic svg,.ai svg{width:17px;height:17px;display:block}.more svg{width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-left:2px}

:root{--bg:#09090b;--glass:#111114;--glass2:#1a1a1f;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--txt:#fafafa;--mut:#a1a1aa;--dim:#71717a;
  --acc:#818cf8;--acc2:#c084fc;--pos:#34d399;--neg:#f87171;--warn:#fbbf24;--orange:#fb923c;--r:24px}
html,body{background:#09090b}
body{font-family:"GeistV",-apple-system,sans-serif;letter-spacing:-.01em}
body::before{background:radial-gradient(620px 320px at 50% -6%,rgba(129,140,248,.18),transparent 70%),#09090b}
header{background:rgba(9,9,11,.8);border-bottom:1px solid var(--line)}
header h1{font-weight:600;letter-spacing:-.04em}
.pill{background:#18181c;border:1px solid var(--line2);color:var(--mut);font-weight:500}.pill .dot{box-shadow:none}
.icon-btn{background:#18181c;border-radius:50%;border-color:var(--line2)}
.view>h2{font-weight:600;letter-spacing:-.05em;font-size:32px}
.sec{text-transform:none;letter-spacing:-.01em;font-size:15px;color:#e4e4e7;font-weight:600}
.card,.metric{background:linear-gradient(180deg,#151519,#0f0f12);border:1px solid var(--line);border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.045);backdrop-filter:none;-webkit-backdrop-filter:none}
.card h3{font-weight:600;font-size:15.5px;letter-spacing:-.025em}
.card .sub{color:var(--dim)}
#v-accueil{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}
#v-accueil>*{grid-column:span 2;margin:0!important;order:5}
#v-accueil>.hero{order:0}
#v-accueil>.grid2{display:contents}
#v-accueil .metric{grid-column:span 1;order:1;min-height:132px;display:flex;flex-direction:column;margin:0}
#v-accueil>.alert{order:2}
#v-accueil>.tile-donut{order:3}
#v-accueil>.foot{order:9}
.hero{background:radial-gradient(110% 120% at 100% 0%,rgba(129,140,248,.38),transparent 52%),radial-gradient(90% 100% at 0% 100%,rgba(52,211,153,.18),transparent 55%),linear-gradient(180deg,#17171d,#0f0f12)!important;border:1px solid rgba(255,255,255,.1)!important;border-radius:28px}
.hero .lbl{color:var(--mut);font-weight:500}
.hero .lbl .badge{background:rgba(255,255,255,.08)!important;color:#e4e4e7!important}
.hero .big{font-size:56px;font-weight:600;letter-spacing:-.065em}
.hero .big .cents{opacity:.5}
.chip{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px}
.g-pos,.g-neg,.g-acc{text-shadow:none}.g-acc{color:#fff}
.bignum{font-weight:600;letter-spacing:-.06em;font-size:42px}
.metric .ic{border-radius:10px;width:32px;height:32px}
.metric .l{color:var(--mut);font-weight:500}
.metric .v{font-size:25px;font-weight:600;letter-spacing:-.055em;margin-top:auto}
.metric .d{color:var(--dim)}
.alert{border-radius:20px;background:#131316!important;border:1px solid var(--line)!important}
.alert.rouge .ai{background:rgba(248,113,113,.15)!important}
.alert .ai{border-radius:10px;box-shadow:none!important}
.row .av{border-radius:12px}
.seg{background:#141418;border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border-radius:999px;font-weight:500}
.seg button.on{background:#fafafa;color:#09090b;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.hbar .track{height:8px;background:#1f1f25}
.badge{border-radius:6px}
.more{color:#c7d2fe;font-weight:500}
.chips button.on{background:#fafafa;color:#09090b;box-shadow:none}
nav{left:16px;right:16px;bottom:calc(14px + var(--sab));border-radius:999px;padding:6px;background:rgba(24,24,28,.8);border:1px solid var(--line2);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 20px 40px rgba(0,0,0,.6)}
nav button{border-radius:999px;font-weight:500;color:#71717a}
nav button.on{background:#fafafa;color:#09090b;box-shadow:none}nav button.on svg{filter:none}
.btn{background:#fafafa;color:#09090b;box-shadow:none;border-radius:14px}
.tile-donut svg{max-width:220px;margin:0 auto}


/* v7 */
.sl{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--mut);margin:12px 0 4px}.sl b{color:var(--txt,#fff);font-size:16px}
input[type=range]{width:100%;accent-color:#a5b4fc;height:28px}
.simo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.simo>div{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:11px 12px}
.simo .l{font-size:11.5px;color:var(--mut)}.simo .v{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:2px 0}
details.hyp{margin-top:10px}details.hyp summary{font-size:13px;color:var(--mut);cursor:pointer}
details.manf>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}details.manf>summary::-webkit-details-marker{display:none}
details.manf>summary>span:first-child{display:flex;flex-direction:column;gap:3px}details.manf .chev{font-size:22px;color:var(--mut);transition:transform .2s}details.manf[open] .chev{transform:rotate(90deg)}
#manForm{display:flex;flex-direction:column;gap:10px;margin-top:14px}#manForm .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#manForm label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mut)}
#manForm input,#manForm select{width:100%;box-sizing:border-box;padding:12px;border-radius:13px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:inherit;font:inherit;font-size:16px;min-height:46px}
#manForm select option{background:#111}#manForm .btn{padding:13px}
.del{display:block;margin:4px 0 0 auto;border:1px solid rgba(255,93,120,.35);background:transparent;color:var(--neg);border-radius:999px;font-size:11.5px;padding:3px 10px;font-weight:600}
</style>
</head>

  <h1>Mes finances</h1>

function renderBudget() {

}

/* ---- simulateur de remboursement anticipé ---- */
let SIM = null;
function iziLoan() { return (D.prets_detail || []).find((p) => p.categorie === 'personnel' && p.complet && p.capital_restant > 0 && p.mensualite > 0); }
function amortir(B, r, pay) { let n = 0, I = 0; while (B > 0.005 && n < 1200) { const i = B * r; I += i; B = B + i - pay; n++; if (B < 0) B = 0; } return { n, I }; }
function calibRate(B, pay, n) { if (pay * n <= B) return 0; let lo = 0, hi = 0.05; for (let k = 0; k < 80; k++) { const mid = (lo + hi) / 2; const pm = mid * B / (1 - Math.pow(1 + mid, -n)); if (pm > pay) hi = mid; else lo = mid; } return (lo + hi) / 2; }
const addMo = (iso, k) => { const d = pd(iso); return new Date(d.getFullYear(), d.getMonth() + k, d.getDate()); };
const fmo = (d) => MOISL[d.getMonth()] + ' ' + d.getFullYear();
const dureeTxt = (n) => { const a = Math.floor(n / 12), m = n % 12; return (a ? a + ' an' + (a > 1 ? 's' : '') : '') + (a && m ? ' ' : '') + (m ? m + ' mois' : '') || '0 mois'; };
function simHtml() {
  const p = iziLoan(); if (!p) return '';
  const B = p.capital_restant, pay = p.mensualite, n = p.mois_restants, r = calibRate(B, pay, n);
  SIM = { p, B, pay, n, r, base: amortir(B, r, pay) };
  const maxL = Math.floor(B / 50) * 50;
  return `<div class="card" id="sim"><h3>Simulateur de remboursement anticipé</h3><p class="sub">${esc(p.nom)} · reste ${eur(B)} · ${eur(pay)}/mois · fin ${fdate(p.date_fin)}</p>
    <div class="sl"><span>Versement ponctuel maintenant</span><b class="num" id="simLv">0 €</b></div>
    <input type="range" id="simL" min="0" max="${maxL}" step="50" value="0" aria-label="Versement ponctuel">
    <div class="chips" style="margin:6px 0 12px">${[0, 500, 1000, 2000, maxL].filter((v, i, a) => v <= maxL && a.indexOf(v) === i).map((v) => `<button data-l="${v}">${v === maxL ? 'Tout' : v ? nf0.format(v) + ' €' : 'Aucun'}</button>`).join('')}</div>
    <div class="sl"><span>En plus chaque mois</span><b class="num" id="simXv">0 €</b></div>
    <input type="range" id="simX" min="0" max="400" step="10" value="0" aria-label="Supplément mensuel">
    <div class="simo" id="simOut"></div>
    <p class="sub" style="margin:10px 0 0">Estimations. Taux mensuel recalculé pour que ${eur(pay)} × ${n} mois remboursent ${eur(B)} (≈ ${(r * 1200).toFixed(2).replace('.', ',')} % par an ; TAEG du contrat ${String(p.taeg).replace('.', ',')} %, l’écart vient sans doute de l’assurance ou des arrondis). La mensualité reste la même et la durée raccourcit. Pour un crédit à la consommation, pas d’indemnité si tu rembourses au plus 10 000 € sur 12 mois ; au-delà, elle est plafonnée à 1 % (0,5 % s’il reste moins d’un an). Demande un décompte à ta banque avant de verser.</p></div>`;
}
function simUpdate() {
  if (!SIM || !$('#simL')) return;
  const L = +$('#simL').value, X = +$('#simX').value, S = SIM;
  const nw = L >= S.B - 0.005 ? { n: 0, I: 0 } : amortir(S.B - L, S.r, S.pay + X);
  const saved = S.base.I - nw.I, gained = S.base.n - nw.n;
  const end = nw.n ? addMo(S.p.prochaine_echeance.date, nw.n - 1) : null;
  $('#simLv').textContent = eur(L, 1); $('#simXv').textContent = eur(X, 1) + '/mois';
  $('#simOut').innerHTML = `<div><div class="l">Intérêts économisés</div><div class="v num ${saved > 0.5 ? 'pos' : ''}">≈ ${eur(saved, 1)}</div></div>
    <div><div class="l">Nouvelle fin</div><div class="v">${end ? fmo(end) : 'soldé'}</div><div class="l">au lieu de ${fmo(pd(S.p.date_fin))}</div></div>
    <div><div class="l">Mois gagnés</div><div class="v num ${gained > 0 ? 'pos' : ''}">${gained}</div><div class="l">${dureeTxt(gained)}</div></div>
    <div><div class="l">Intérêts restants</div><div class="v num">≈ ${eur(nw.I, 1)}</div><div class="l">au lieu de ≈ ${eur(S.base.I, 1)}</div></div>`;

function bindSim() {

/* ---- saisies manuelles : chiffrées sur l’appareil avec une clé dérivée du code ---- */
const MAN_KEY = 'mf-manuel', MAN_SALT = 'mes-finances/manuel/v1';
let MKEY = null, MANUEL = [], RAW = null, MAN_ERR = false;
const r2 = (n) => Math.round(n * 100) / 100;
const b64e = (buf) => { let t = ''; new Uint8Array(buf).forEach((c) => (t += String.fromCharCode(c))); return btoa(t); };
const clone = (o) => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
const isoToday = () => { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); };
async function deriveMKey(code) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(MAN_SALT), iterations: 310000 }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function loadManuel() {
  MAN_ERR = false; const t = localStorage.getItem(MAN_KEY); if (!t) return [];
  try { const o = JSON.parse(t); const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(o.iv) }, MKEY, b64(o.ct)); const a = JSON.parse(new TextDecoder().decode(pt)); return Array.isArray(a) ? a : []; }
  catch (e) { MAN_ERR = true; return []; }
}
async function saveManuel() {
  if (MAN_ERR) { try { localStorage.setItem(MAN_KEY + '-ancien', localStorage.getItem(MAN_KEY) || ''); } catch (e) {} MAN_ERR = false; }
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, MKEY, new TextEncoder().encode(JSON.stringify(MANUEL)));
  localStorage.setItem(MAN_KEY, JSON.stringify({ v: 1, iv: b64e(iv), ct: b64e(ct) }));
}
const manActifs = () => (D && D.manuel ? D.manuel.filter((e) => !e.doublon) : []);
function applyManual(X) {
  X.manuel = MANUEL.map((e) => {
    const dup = X.operations.find((o) => o.montant < 0 && Math.abs(-o.montant - e.montant) < 0.005 && Math.abs(pd(o.date) - pd(e.date)) <= 3 * 864e5)
      || (X.en_cours || []).find((o) => Math.abs(-o.montant - e.montant) < 0.005 && (!o.date || Math.abs(pd(o.date) - pd(e.date)) <= 3 * 864e5));
    return { ...e, doublon: dup ? dup.libelle + (dup.date ? ' du ' + fdate(dup.date) : '') : null };
  });
  const act = X.manuel.filter((e) => !e.doublon);
  X.manuel_total = r2(act.reduce((a, e) => a + e.montant, 0));
  if (!act.length) return X;
  act.forEach((e) => X.operations.push({ date: e.date, libelle: e.libelle, montant: -e.montant, solde: null, kind: 'manuel', cat: e.categorie, estime: true, note: null, manuel: e.id }));
  X.operations.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  X.solde_dispo = r2(X.solde_dispo - X.manuel_total);
  const E = X.estimation;
  if (E) { const t = act.filter((e) => e.date <= E.fin).reduce((a, e) => a + e.montant, 0); ['solde_apres_prelevements', 'solde_si_incertains', 'solde_avec_depenses_moyennes'].forEach((k) => { if (E[k] != null) E[k] = r2(E[k] - t); }); E.decouvert = E.solde_apres_prelevements < 0; }
  const P = X.projection;
  if (P && P.points && P.points.length) {
    const pts = P.points, d0 = pts[0][0];
    act.slice().sort((a, b) => (a.date < b.date ? -1 : 1)).forEach((e) => {
      if (e.date <= d0) { pts.forEach((p) => (p[1] = r2(p[1] - e.montant))); return; }
      if (P.horizon && e.date > P.horizon) return;
      let i = pts.findIndex((p) => p[0] > e.date); if (i < 0) i = pts.length;
      const prev = pts[i - 1][1];
      for (let k = i; k < pts.length; k++) pts[k][1] = r2(pts[k][1] - e.montant);
      pts.splice(i, 0, [e.date, r2(prev - e.montant), e.libelle + ' (saisie manuelle)']);
    });
    const mn = pts.reduce((a, p) => (p[1] < a[1] ? p : a), pts[0]); P.min = { solde: mn[1], date: mn[0] };
    (P.gros || []).forEach((g) => { const t = act.filter((e) => e.date <= g.date || e.date <= d0).reduce((a, e) => a + e.montant, 0); g.avant = r2(g.avant - t); g.apres = r2(g.apres - t); g.solde_bas = g.apres < P.seuil; });
    X.alertes_solde_bas = (P.gros || []).filter((g) => g.solde_bas);
  }
  const B = X.budgets, mo = X.donnees_au.slice(0, 7);
  if (B) {
    act.filter((e) => e.date.slice(0, 7) === mo).forEach((e) => {
      const l = B.lignes.find((x) => x.categorie === e.categorie);
      if (l) { l.depense = r2(l.depense + e.montant); l.pct = l.budget ? r2(100 * l.depense / l.budget) : 0; l.statut = l.pct > 100 ? 'rouge' : l.pct >= B.seuil_orange * 100 ? 'orange' : 'vert'; l.reste = r2(l.budget - l.depense); }
      else { const h = B.hors_budget.find((x) => x.categorie === e.categorie); if (h) h.depense = r2(h.depense + e.montant); else B.hors_budget.push({ categorie: e.categorie, depense: r2(e.montant) }); }
      B.total_depense = r2(B.total_depense + e.montant);
    });
    B.lignes.sort((a, b) => b.pct - a.pct);
    X.alertes_budget = B.lignes.filter((l) => l.statut !== 'vert').map((l) => ({ categorie: l.categorie, depense: l.depense, budget: l.budget, pct: l.pct, niveau: l.statut }));
  }
  const T = X.douze_mois;
  if (T) ['solde_budgets', 'solde_habitudes'].forEach((k) => T[k].forEach((p) => { const t = act.filter((e) => e.date <= p[0] || e.date <= X.donnees_au).reduce((a, e) => a + e.montant, 0); p[1] = r2(p[1] - t); }));
  return X;
}
function rebuild() { D = applyManual(clone(RAW)); render(); }
function manCats() {
  const c = [];
  (D.budgets ? D.budgets.lignes.map((l) => l.categorie) : []).concat((D.categories || []).map((x) => x.name)).concat(['Autres']).forEach((x) => { if (x && !c.includes(x) && !/^Prêts|^Épargne|^Virements/.test(x)) c.push(x); });
  return c.sort((a, b) => a.localeCompare(b, 'fr'));
}
function manHtml() {
  const L = D.manuel || [];
  return `<details class="card manf" ${ST.manOpen ? 'open' : ''}><summary><span><h3 style="margin:0">Ajouter une dépense</h3><span class="sub" style="margin:0">${L.length ? L.length + ' saisie' + (L.length > 1 ? 's' : '') + ' manuelle' + (L.length > 1 ? 's' : '') : 'Pas encore sur le relevé ? Note-la ici.'}</span></span><span class="chev">›</span></summary>
    ${MAN_ERR ? `<div class="alert orange" style="margin-top:12px"><div class="ai">${ICON.info}</div><div><div class="ax">Des saisies enregistrées avec un autre code n’ont pas pu être lues. Elles sont conservées sur l’appareil mais ne sont pas affichées.</div></div></div>` : ''}
    <form id="manForm" autocomplete="off">
      <div class="frow"><label>Montant (€)<input id="mAmt" inputmode="decimal" placeholder="12,50" required></label><label>Date<input id="mDate" type="date" value="${isoToday()}" required></label></div>
      <label>Libellé<input id="mLib" maxlength="60" placeholder="Boulangerie, plein d’essence…" required></label>
      <label>Catégorie<select id="mCat">${manCats().map((c) => `<option ${c === 'Autres' ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
      <div id="mErr" class="neg" style="min-height:0;font-size:13px"></div>
      <button class="btn" type="submit">Ajouter</button>
    </form>
    ${L.length ? `<div class="daysep">Saisies manuelles</div>${L.slice().sort((a, b) => (a.date < b.date ? 1 : -1)).map((e) => `<div class="row">${av(e.libelle, '#facc15')}<div class="main"><div class="t">${esc(e.libelle)}</div><div class="s">${flong(e.date)} · ${esc(e.categorie)} <span class="badge w">manuel</span>${e.doublon ? `<br><span class="warn">Probablement déjà importée (${esc(e.doublon)}) : ignorée, tu peux la supprimer.</span>` : ''}</div></div><div class="amt num">${eurS(-e.montant)}<button class="del" data-del="${esc(e.id)}" aria-label="Supprimer">Supprimer</button></div></div>`).join('')}` : ''}
    <p class="sub" style="margin:10px 0 0">Enregistrées uniquement sur cet appareil, chiffrées avec ton code. Comptées dans le solde disponible, les budgets du mois et les projections. Si la même somme apparaît sur un relevé à ±3 jours, la saisie est ignorée automatiquement.</p></details>`;
}
function bindMan(root) {
  const det = root.querySelector('.manf'); if (!det) return;
  det.addEventListener('toggle', () => (ST.manOpen = det.open));
  root.querySelector('#manForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const amt = parseFloat(String($('#mAmt').value).replace(/\s/g, '').replace(',', '.')), lib = $('#mLib').value.trim(), date = $('#mDate').value, cat = $('#mCat').value;
    if (!(amt > 0 && amt < 100000)) { $('#mErr').textContent = 'Montant invalide.'; return; }
    if (!lib) { $('#mErr').textContent = 'Ajoute un libellé.'; return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { $('#mErr').textContent = 'Date invalide.'; return; }
    MANUEL.push({ id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), date, libelle: lib.slice(0, 60), montant: r2(amt), categorie: cat, cree_le: new Date().toISOString() });
    await saveManuel(); ST.manOpen = true; rebuild();
  });
  root.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', async () => {
    if (!confirm('Supprimer cette saisie ?')) return;
    MANUEL = MANUEL.filter((e) => e.id !== b.dataset.del); await saveManuel(); rebuild();
  }));
}
const KIND = { manuel: ['manuel', 'w'], interne: ['Interne', 'b'], regulier: ['Revenu', 'g'], partage_out: ['Partage de frais', ''], autre_rentree: ['Rentrée', 'g'], ponctuel: ['Ponctuel', 'w'], courante: ['', ''], remboursement: ['Remboursement', 'g'], cagnotte: ['Cagnotte charges', 'b'] };
function renderOps(filter, q) {
  const root = $('#v-ops'); const ql = q.trim().toLowerCase();
  const list = D.operations.filter((o) => {
    if (filter === 'dep' && !(o.montant < 0 && o.kind !== 'interne')) return false;
    if (filter === 'rev' && !(o.montant > 0 && o.kind !== 'interne')) return false;
    if (filter === 'int' && o.kind !== 'interne') return false;
    if (filter === 'pon' && !(o.kind === 'ponctuel' || (o.note && /ponctuel/i.test(o.note)))) return false;
    if (filter === 'pret' && o.cat !== 'Prêts & crédit') return false;
    if (ql && !(o.libelle.toLowerCase().includes(ql) || (o.cat || '').toLowerCase().includes(ql))) return false;
    return true;
  });
  let html = '', last = '';
  list.slice(0, 400).forEach((o) => {
    if (o.date !== last) { html += `<div class="daysep">${flong(o.date)} ${pd(o.date).getFullYear()}</div>`; last = o.date; }
    const k = KIND[o.kind] || ['', ''];
    html += `<div class="row ${o.kind === 'interne' ? 'op-int' : ''}">${av(o.libelle, o.kind === 'interne' ? '#475069' : o.montant > 0 ? '#34d399' : null)}<div class="main"><div class="t">${esc(o.libelle)}</div><div class="s">${esc(o.cat)}${k[0] ? ` <span class="badge ${k[1]}">${k[0]}</span>` : ''}</div></div><div class="amt num ${o.montant > 0 ? 'pos' : ''}">${eurS(o.montant)}<small>${o.manuel ? 'pas encore relevée' : `solde ${o.estime ? '≈ ' : ''}${eur(o.solde)}`}</small></div></div>`;
  });
  const pend = (D.en_cours || []).map((o) => `<div class="row">${av(o.libelle, '#fb923c')}<div class="main"><div class="t">${esc(o.libelle)}</div><div class="s">Carte en cours${o.date ? ' · ' + flong(o.date) : ''}${o.solde_incluant != null ? ' · solde l’incluant ' + eur(o.solde_incluant) : ''}</div></div><div class="amt num">${eurS(o.montant)}</div></div>`)
    .concat((D.a_venir || []).map((o) => `<div class="row">${av('AV', '#c084fc')}<div class="main"><div class="t">Opération à venir</div><div class="s">${esc(o.note || o.libelle)}</div></div><div class="amt num">${eurS(o.montant)}</div></div>`)).join('');
  ST.opsf = filter;
  root.innerHTML = `<h2>Opérations</h2>
    ${manHtml()}
    <input class="search" type="search" placeholder="Rechercher un libellé ou une catégorie" value="${esc(q)}">
    <div class="chips">${[['all', 'Tout'], ['dep', 'Dépenses'], ['rev', 'Rentrées'], ['pret', 'Prêts'], ['pon', 'Ponctuels'], ['int', 'Internes']].map(([v, l]) => `<button data-f="${v}" class="${v === filter ? 'on' : ''}">${l}</button>`).join('')}</div>
    ${pend && filter === 'all' && !ql ? `<div class="card" style="padding-top:8px"><div class="daysep">En attente</div>${pend}</div>` : ''}
    <div class="card" style="padding-top:8px">${html || '<p class="sub">Aucune opération.</p>'}</div>
    <div class="foot">${list.length} opération${list.length > 1 ? 's' : ''}${manActifs().length ? ' dont ' + manActifs().length + ' saisie' + (manActifs().length > 1 ? 's' : '') + ' manuelle' + (manActifs().length > 1 ? 's' : '') : ''} · compte courant · ${D.nb_internes} virements internes exclus des calculs (en grisé)</div>`;
  const s = root.querySelector('.search');
  s.addEventListener('input', () => { const pos = s.selectionStart; renderOps(filter, s.value); const n = $('#v-ops .search'); n.focus(); n.setSelectionRange(pos, pos); });
  root.querySelectorAll('.chips button').forEach((b) => b.addEventListener('click', () => { renderOps(b.dataset.f, s.value); }));
  bindMan(root);
}

/* ---------------- boot ---------------- */
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
(async () => { const saved = localStorage.getItem(LS_KEY); if (saved) { $('#remember').checked = true; await unlock(saved, true, true); } })();
